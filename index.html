<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب مشتریان</title>
<style>
:root {
  color-scheme: dark;
  --bg:#111;
  --panel:#1b1b1b;
  --light:#252525;
  --gold:#d6b45a;
  --text:#f3f0e8;
  --muted:#aaa;
  --border:#38342a;
  --danger:#db6666;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px 10px 35px;background:var(--bg);
  color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:14px
}
.app{max-width:900px;margin:auto}
h1{margin:0 0 14px;color:var(--gold);font-size:23px;text-align:center}
h2{margin:0 0 12px;color:var(--gold);font-size:17px}
.panel{margin-bottom:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
label{display:block;margin-bottom:5px;color:#d7d1c2;font-size:12px}
input{
  width:100%;min-height:38px;padding:8px 9px;border:1px solid #454137;
  border-radius:7px;background:#111;color:var(--text);font:inherit
}
input:focus{outline:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.product{padding:10px;border:1px solid var(--border);border-radius:9px;background:#151515}
.product-title{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:8px;font-weight:bold}
.price{color:var(--gold);font-size:11px;white-space:nowrap}
.quantity-control{display:flex;align-items:center;gap:7px}
.quantity-control input{min-height:34px;text-align:center}
button{
  min-height:35px;padding:7px 11px;border:0;border-radius:7px;
  background:var(--gold);color:#17140c;cursor:pointer;font:inherit;font-weight:bold
}
button:hover{filter:brightness(1.1)}
.qty-btn{flex:0 0 32px;min-height:32px;padding:0;font-size:19px}
.secondary{border:1px solid #5b5135;background:transparent;color:var(--gold)}
.danger{border:1px solid #713c3c;background:transparent;color:var(--danger)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.form-footer,.customer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.total,.customer-total{color:var(--gold);font-weight:bold}
.total{font-size:16px}
.debt-summary{padding:15px;margin:10px 0 14px;border:1px solid var(--gold);border-radius:10px;background:#242117;text-align:center}
.debt-label{font-size:13px}
.debt-amount{margin-top:6px;color:var(--gold);font-size:25px;font-weight:bold}
.debt-description{margin-top:5px;color:var(--muted);font-size:11px}
.customer-card{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:9px;background:#151515}
.customer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.customer-name{color:var(--gold);font-size:16px;font-weight:bold;overflow-wrap:anywhere}
.mobile{margin-top:4px;color:var(--muted);font-size:12px;direction:ltr;text-align:right}
.customer-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.customer-item{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:7px;border-radius:7px;background:var(--light);font-size:12px}
.customer-item .quantity-control{gap:4px}
.customer-item .qty-btn{flex-basis:26px;min-height:27px;font-size:16px}
.count{min-width:18px;text-align:center}
.empty{padding:18px 8px;color:var(--muted);text-align:center}
.bank-panel{padding:10px 12px}
.bank-panel h2{font-size:14px;margin-bottom:8px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:8px}
.bank-panel input,.bank-panel button{min-height:32px;padding:5px 8px;font-size:12px}
.bank-panel .note{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.8}
.ltr{direction:ltr;text-align:left}
@media(max-width:600px){
  body{padding:12px 8px 25px}
  .panel{padding:11px}
  .products,.customer-items{grid-template-columns:1fr}
  .customer-head{flex-direction:column}
  .settings-grid{grid-template-columns:1fr 1fr}
  .settings-grid button{grid-column:1/-1}
  .debt-amount{font-size:22px}
}
</style>
</head>
<body>
<main class="app">
<h1>🧾 حساب مشتریان</h1>

<section class="panel bank-panel">
  <h2>🏦 تنظیمات کارت بانکی</h2>
  <div class="settings-grid">
    <div>
      <label for="cardNumber">شماره کارت</label>
      <input id="cardNumber" class="ltr" type="text" inputmode="numeric"
        maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX">
    </div>
    <div>
      <label for="cardHolder">نام صاحب حساب</label>
      <input id="cardHolder" type="text" placeholder="نام صاحب حساب">
    </div>
    <button type="button" id="saveSettings">ذخیره</button>
  </div>
  <p class="note">اطلاعات کارت در پیام بدهی مشتریان درج می‌شود.</p>
</section>

<section class="panel">
  <h2 id="formTitle">افزودن مشتری</h2>
  <form id="customerForm">
    <div class="grid">
      <div>
        <label for="customerName">نام مشتری *</label>
        <input id="customerName" required autocomplete="name" placeholder="نام مشتری">
      </div>
      <div>
        <label for="customerMobile">شماره موبایل (اختیاری)</label>
        <input id="customerMobile" type="tel" inputmode="tel" placeholder="شماره موبایل">
      </div>
    </div>

    <div class="products" id="formProducts"></div>

    <div class="form-footer">
      <div class="total">جمع بدهی: <span id="formTotal">۰</span> تومان</div>
      <div class="actions">
        <button type="submit" id="saveButton">ذخیره مشتری</button>
        <button type="button" class="secondary" id="cancelEdit" hidden>انصراف از ویرایش</button>
      </div>
    </div>
  </form>
</section>

<section class="panel">
  <h2>👥 مشتریان</h2>
  <div class="debt-summary">
    <div class="debt-label">مجموع کل طلب‌ها از همه مشتریان</div>
    <div class="debt-amount"><span id="grandTotal">۰</span> تومان</div>
    <div class="debt-description">مجموع بدهی مشتریان ثبت‌شده</div>
  </div>
  <div id="customerList"></div>
</section>
</main>

<script>
(() => {
"use strict";

const PRODUCTS = [
  {key:"apple",name:"سیب",emoji:"🍎",price:1200000},
  {key:"raisins",name:"کشمش",emoji:"🍇",price:1000000},
  {key:"cans",name:"قوطی",emoji:"🥫",price:1000000}
];

const CUSTOMER_KEY = "hesab_customers_v1";
const SETTINGS_KEY = "hesab_settings_v1";
const emptyQuantities = () => ({apple:0,raisins:0,cans:0});

function loadJSON(key,fallback){
  try{
    const value=localStorage.getItem(key);
    return value===null?fallback:JSON.parse(value);
  }catch{return fallback;}
}

let customers = loadJSON(CUSTOMER_KEY,[]);
if(!Array.isArray(customers)) customers=[];

let settings = loadJSON(SETTINGS_KEY,{cardNumber:"",cardHolder:""});
if(!settings || typeof settings!=="object") settings={cardNumber:"",cardHolder:""};

let editingId=null;
let formQuantities=emptyQuantities();

const $ = id => document.getElementById(id);
const form=$("customerForm");
const formProducts=$("formProducts");
const customerList=$("customerList");
const nameInput=$("customerName");
const mobileInput=$("customerMobile");
const formTotal=$("formTotal");
const formTitle=$("formTitle");
const saveButton=$("saveButton");
const cancelEdit=$("cancelEdit");
const cardNumberInput=$("cardNumber");
const cardHolderInput=$("cardHolder");

function formatNumber(number){
  return new Intl.NumberFormat("fa-IR").format(number);
}

function normalizeDigits(value){
  return String(value)
    .replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
    .replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
}

function formatCard(value){
  const digits=normalizeDigits(value).replace(/\D/g,"").slice(0,16);
  return digits.match(/.{1,4}/g)?.join("-")||"";
}

function totalFor(quantities){
  return PRODUCTS.reduce((sum,p)=>{
    const qty=Math.max(0,Math.floor(Number(quantities?.[p.key])||0));
    return sum+qty*p.price;
  },0);
}

function saveCustomers(){
  try{
    localStorage.setItem(CUSTOMER_KEY,JSON.stringify(customers));
  }catch{
    alert("ذخیره مشتریان انجام نشد. فضای ذخیره‌سازی مرورگر را بررسی کنید.");
  }
}

function updateFormTotal(){
  formTotal.textContent=formatNumber(totalFor(formQuantities));
}

function makeProductControls(container,quantities,onChange,prefix){
  container.replaceChildren();

  PRODUCTS.forEach(product=>{
    const wrapper=document.createElement("div");
    wrapper.className="product";

    const title=document.createElement("div");
    title.className="product-title";

    const productName=document.createElement("span");
    productName.textContent=`${product.emoji} ${product.name}`;

    const price=document.createElement("span");
    price.className="price";
    price.textContent=`${formatNumber(product.price)} تومان`;

    title.append(productName,price);

    const controls=document.createElement("div");
    controls.className="quantity-control";

    const minus=document.createElement("button");
    minus.type="button";
    minus.className="qty-btn secondary";
    minus.textContent="−";
    minus.setAttribute("aria-label",`کاهش ${product.name}`);

    const input=document.createElement("input");
    input.type="number";
    input.min="0";
    input.step="1";
    input.inputMode="numeric";
    input.value=Math.max(0,Math.floor(Number(quantities[product.key])||0));
    input.id=`${prefix}-${product.key}`;
    input.setAttribute("aria-label",`تعداد ${product.name}`);

    const plus=document.createElement("button");
    plus.type="button";
    plus.className="qty-btn";
    plus.textContent="+";
    plus.setAttribute("aria-label",`افزایش ${product.name}`);

    function update(value){
      const count=Math.max(0,Math.floor(Number(value)||0));
      quantities[product.key]=count;
      input.value=count;
      onChange();
    }

    minus.addEventListener("click",()=>update(Number(input.value)-1));
    plus.addEventListener("click",()=>update(Number(input.value)+1));
    input.addEventListener("input",()=>update(input.value));

    controls.append(minus,input,plus);
    wrapper.append(title,controls);
    container.appendChild(wrapper);
  });
}

function renderFormProducts(){
  makeProductControls(formProducts,formQuantities,updateFormTotal,"form");
  updateFormTotal();
}

function updateGrandTotal(){
  const total=customers.reduce((sum,c)=>sum+totalFor(c.quantities),0);
  $("grandTotal").textContent=formatNumber(total);
}

function renderCustomers(){
  customerList.replaceChildren();
  updateGrandTotal();

  if(customers.length===0){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="هنوز مشتری‌ای ثبت نشده است.";
    customerList.appendChild(empty);
    return;
  }

  customers.forEach(customer=>{
    const card=document.createElement("article");
    card.className="customer-card";

    const head=document.createElement("div");
    head.className="customer-head";

    const identity=document.createElement("div");
    const customerName=document.createElement("div");
    customerName.className="customer-name";
    customerName.textContent=customer.name;
    identity.appendChild(customerName);

    if(customer.mobile){
      const mobile=document.createElement("div");
      mobile.className="mobile";
      mobile.textContent=customer.mobile;
      identity.appendChild(mobile);
    }

    const actions=document.createElement("div");
    actions.className="actions";

    const editButton=document.createElement("button");
    editButton.type="button";
    editButton.className="secondary";
    editButton.textContent="ویرایش";
    editButton.addEventListener("click",()=>startEdit(customer.id));

    const deleteButton=document.createElement("button");
    deleteButton.type="button";
    deleteButton.className="danger";
    deleteButton.textContent="حذف / تسویه";
    deleteButton.addEventListener("click",()=>deleteCustomer(customer.id));

    actions.append(editButton,deleteButton);
    head.append(identity,actions);

    const items=document.createElement("div");
    items.className="customer-items";

    PRODUCTS.forEach(product=>{
      const item=document.createElement("div");
      item.className="customer-item";

      const label=document.createElement("span");
      label.textContent=`${product.emoji} ${product.name}`;

      const controls=document.createElement("div");
      controls.className="quantity-control";

      const minus=document.createElement("button");
      minus.type="button";
      minus.className="qty-btn secondary";
      minus.textContent="−";
      minus.setAttribute("aria-label",`کاهش ${product.name} برای ${customer.name}`);

      const count=document.createElement("span");
      count.className="count";
      count.textContent=formatNumber(Number(customer.quantities?.[product.key])||0);

      const plus=document.createElement("button");
      plus.type="button";
      plus.className="qty-btn";
      plus.textContent="+";
      plus.setAttribute("aria-label",`افزایش ${product.name} برای ${customer.name}`);

      function adjust(delta){
        customer.quantities ??=emptyQuantities();
        customer.quantities[product.key]=Math.max(
          0,(Number(customer.quantities[product.key])||0)+delta
        );
        saveCustomers();
        renderCustomers();
      }

      minus.addEventListener("click",()=>adjust(-1));
      plus.addEventListener("click",()=>adjust(1));

      controls.append(minus,count,plus);
      item.append(label,controls);
      items.appendChild(item);
    });

    const bottom=document.createElement("div");
    bottom.className="customer-bottom";

    const total=document.createElement("div");
    total.className="customer-total";
    total.setAttribute("aria-live","polite");
    total.textContent=`جمع بدهی: ${formatNumber(totalFor(customer.quantities))} تومان`;

    const messageButton=document.createElement("button");
    messageButton.type="button";
    messageButton.textContent="📋 تولید و کپی پیام";
    messageButton.addEventListener("click",()=>generateAndCopy(customer));

    bottom.append(total,messageButton);
    card.append(head,items,bottom);
    customerList.appendChild(card);
  });
}

function startEdit(id){
  const customer=customers.find(c=>c.id===id);
  if(!customer)return;

  editingId=id;
  nameInput.value=customer.name;
  mobileInput.value=customer.mobile||"";
  formQuantities={
    apple:Number(customer.quantities?.apple)||0,
    raisins:Number(customer.quantities?.raisins)||0,
    cans:Number(customer.quantities?.cans)||0
  };

  renderFormProducts();
  formTitle.textContent="ویرایش مشتری";
  saveButton.textContent="ذخیره تغییرات";
  cancelEdit.hidden=false;
  form.scrollIntoView({behavior:"smooth",block:"start"});
  nameInput.focus();
}

function resetForm(){
  form.reset();
  editingId=null;
  formQuantities=emptyQuantities();
  formTitle.textContent="افزودن مشتری";
  saveButton.textContent="ذخیره مشتری";
  cancelEdit.hidden=true;
  renderFormProducts();
}

function deleteCustomer(id){
  const customer=customers.find(c=>c.id===id);
  if(!customer)return;

  if(!confirm(`مشتری «${customer.name}» حذف شود؟ بدهی او از مجموع طلب‌ها کم خواهد شد.`))return;

  customers=customers.filter(c=>c.id!==id);
  saveCustomers();
  renderCustomers();

  if(editingId===id)resetForm();
}

function buildMessage(customer){
  const lines=[`${customer.name} عزیز`,""];

  PRODUCTS.forEach(product=>{
    const quantity=Number(customer.quantities?.[product.key])||0;
    if(quantity>0){
      lines.push(
        `${product.name}: ${formatNumber(quantity)} عدد - ${formatNumber(quantity*product.price)} تومان`
      );
    }
  });

  lines.push("");
  lines.push(`جمع کل بدهی: ${formatNumber(totalFor(customer.quantities))} تومان`);

  if(settings.cardNumber||settings.cardHolder){
    lines.push("");
    lines.push("اطلاعات واریز:");
    if(settings.cardNumber)lines.push(`شماره کارت: ${settings.cardNumber}`);
    if(settings.cardHolder)lines.push(`به نام: ${settings.cardHolder}`);
  }

  return lines.join("\n");
}

async function generateAndCopy(customer){
  const message=buildMessage(customer);

  try{
    await navigator.clipboard.writeText(message);
    alert("پیام کپی شد.");
  }catch{
    const area=document.createElement("textarea");
    area.value=message;
    area.style.position="fixed";
    area.style.opacity="0";
    document.body.appendChild(area);
    area.select();

    let copied=false;
    try{copied=document.execCommand("copy");}catch{}

    area.remove();

    if(copied)alert("پیام کپی شد.");
    else window.prompt("متن زیر را کپی کنید:",message);
  }
}

form.addEventListener("submit",event=>{
  event.preventDefault();

  const name=nameInput.value.trim();
  if(!name){
    nameInput.focus();
    return;
  }

  const normalizedMobile=normalizeDigits(mobileInput.value.trim()).replace(/\D/g,"");

  const record={
    id:editingId||(crypto.randomUUID?.()??`${Date.now()}-${Math.random()}`),
    name,
    mobile:normalizedMobile||mobileInput.value.trim(),
    quantities:{...formQuantities}
  };

  if(editingId){
    customers=customers.map(c=>c.id===editingId?record:c);
  }else{
    customers.unshift(record);
  }

  saveCustomers();
  renderCustomers();
  resetForm();
});

cancelEdit.addEventListener("click",resetForm);

cardNumberInput.addEventListener("input",()=>{
  const position=cardNumberInput.selectionStart||0;
  const before=cardNumberInput.value.slice(0,position);
  const digitsBefore=normalizeDigits(before).replace(/\D/g,"").length;

  cardNumberInput.value=formatCard(cardNumberInput.value);

  let newPosition=0;
  let seen=0;
  while(newPosition<cardNumberInput.value.length&&seen<digitsBefore){
    if(/\d/.test(cardNumberInput.value[newPosition]))seen++;
    newPosition++;
  }
  if(digitsBefore>0&&digitsBefore%4===0&&newPosition<cardNumberInput.value.length)newPosition++;
  cardNumberInput.setSelectionRange(newPosition,newPosition);
});

$("saveSettings").addEventListener("click",()=>{
  settings={
    cardNumber:formatCard(cardNumberInput.value),
    cardHolder:cardHolderInput.value.trim()
  };

  cardNumberInput.value=settings.cardNumber;

  try{
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
    alert("تنظیمات کارت ذخیره شد.");
  }catch{
    alert("ذخیره تنظیمات انجام نشد.");
  }
});

cardNumberInput.value=formatCard(settings.cardNumber||"");
cardHolderInput.value=settings.cardHolder||"";

renderFormProducts();
renderCustomers();
})();
</script>
</body>
</html>
