<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>حساب مشتریان</title> <style> :root { color-scheme: dark; --bg: #111; --panel: #1b1b1b; --panel-light: #242424; --gold: #d6b45a; --text: #f3f0e8; --muted: #aaa; --border: #38342a; --danger: #db6666; } * { box-sizing: border-box; } body { margin: 0; padding: 20px 12px 40px; background: var(--bg); color: var(--text); font-family: Tahoma, Arial, sans-serif; font-size: 14px; } .app { max-width: 900px; margin: 0 auto; } h1 { margin: 0 0 10px; color: var(--gold); font-size: 23px; text-align: center; } h2 { margin: 0 0 14px; color: var(--gold); font-size: 17px; } .panel { margin-bottom: 14px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); } /* کادر کوچک اطلاعات کارت */ .top-settings { margin-bottom: 7px; padding: 6px 9px; } .top-settings h2 { margin-bottom: 5px; font-size: 11px; } .settings-grid { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; gap: 6px; } .top-settings label { margin-bottom: 3px; font-size: 10px; } .top-settings input { min-height: 27px; padding: 4px 6px; font-size: 11px; } .top-settings button { min-height: 27px; padding: 4px 8px; font-size: 11px; } .top-settings .note { margin-top: 3px; font-size: 9px; line-height: 1.5; } /* کادر کوچک خلاصه طلب ها */ .debt-summary { margin-bottom: 9px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); } .debt-summary h2 { margin-bottom: 5px; font-size: 12px; } .debt-customer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 11px; } .debt-customer-row:last-child { border-bottom: none; } .debt-customer-name { color: var(--text); overflow-wrap: anywhere; } .debt-customer-amount { color: var(--gold); font-weight: bold; white-space: nowrap; } .debt-grand-total { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; padding: 7px 9px; border-radius: 7px; background: var(--panel-light); color: var(--gold); font-size: 12px; font-weight: bold; } .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } label { display: block; margin-bottom: 6px; color: #d7d1c2; font-size: 12px; } input { width: 100%; min-height: 39px; padding: 8px 10px; border: 1px solid #454137; border-radius: 7px; outline: none; background: #111; color: var(--text); font: inherit; } input:focus { border-color: var(--gold); } .products { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin: 14px 0; } .product { padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: #151515; } .product-title { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; font-weight: bold; } .price { color: var(--gold); font-size: 11px; white-space: nowrap; } .quantity-control { display: flex; align-items: center; gap: 8px; } .quantity-control input { min-height: 34px; text-align: center; } button { min-height: 36px; padding: 7px 12px; border: 0; border-radius: 7px; background: var(--gold); color: #17140c; cursor: pointer; font: inherit; font-weight: bold; } button:hover { background: #e6c86e; } .qty-btn { flex: 0 0 34px; min-height: 34px; padding: 0; font-size: 19px; } .secondary { border: 1px solid #5b5135; background: transparent; color: var(--gold); } .secondary:hover { background: #2b271d; } .danger { border: 1px solid #713c3c; background: transparent; color: var(--danger); } .danger:hover { background: #321d1d; } .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; } .total { color: var(--gold); font-size: 16px; font-weight: bold; } .actions { display: flex; gap: 8px; flex-wrap: wrap; } .customer-card { margin-top: 10px; padding: 13px; border: 1px solid var(--border); border-radius: 9px; background: #151515; } .customer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; } .customer-name { color: var(--gold); font-size: 16px; font-weight: bold; } .mobile { margin-top: 4px; color: var(--muted); font-size: 12px; direction: ltr; text-align: right; } .customer-items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; } .customer-item { display: flex; align-items: center; justify-content: space-between; gap: 5px; padding: 7px; border-radius: 7px; background: var(--panel-light); font-size: 12px; } .customer-item .quantity-control { gap: 5px; } .customer-item .qty-btn { flex-basis: 27px; min-height: 27px; font-size: 16px; } .customer-item .count { min-width: 18px; text-align: center; } .customer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .customer-total { color: var(--gold); font-weight: bold; } .empty { padding: 12px 6px; color: var(--muted); text-align: center; font-size: 11px; } .ltr { direction: ltr; text-align: left; } .note { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.8; } @media (max-width: 600px) { body { padding: 10px 7px 25px; } .panel { padding: 12px; } .top-settings { padding: 6px 8px; } .debt-summary { padding: 7px 9px; } .products, .customer-items { grid-template-columns: 1fr; } .settings-grid { grid-template-columns: 1fr 1fr; } .settings-grid button { grid-column: 1 / -1; } .customer-head { flex-direction: column; } .debt-grand-total { font-size: 11px; padding: 7px; } .debt-customer-row { font-size: 10px; } } </style> </head> <body> <main class="app"> <h1>🧾 حساب مشتریان</h1> <section class="panel top-settings"> <h2>🏦 اطلاعات کارت بانکی</h2> <div class="settings-grid"> <div> <label for="cardNumber">شماره کارت</label> <input id="cardNumber" class="ltr" type="text" inputmode="numeric" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" > </div> <div> <label for="cardHolder">نام صاحب حساب</label> <input id="cardHolder" type="text" placeholder="نام صاحب حساب" > </div> <button type="button" id="saveSettings">ذخیره</button> </div> <p class="note"> اطلاعات کارت در پیام مشتریان درج می‌شود. </p> </section> <section class="debt-summary"> <h2>💰 خلاصه طلب‌ها</h2> <div id="debtCustomerList"></div> <div class="debt-grand-total"> <span>جمع کل طلب‌ها:</span> <span><span id="grandTotal">۰</span> تومان</span> </div> </section> <section class="panel"> <h2 id="formTitle">افزودن مشتری</h2> <form id="customerForm"> <div class="grid"> <div> <label for="customerName">نام مشتری *</label> <input id="customerName" type="text" required autocomplete="name" placeholder="نام مشتری" > </div> <div> <label for="customerMobile">شماره موبایل (اختیاری)</label> <input id="customerMobile" type="tel" inputmode="tel" placeholder="09xxxxxxxxx" > </div> </div> <div class="products" id="formProducts"></div> <div class="form-footer"> <div class="total"> جمع بدهی: <span id="formTotal" aria-live="polite">۰</span> تومان </div> <div class="actions"> <button type="submit" id="saveButton">ذخیره مشتری</button> <button type="button" class="secondary" id="cancelEdit" hidden> انصراف از ویرایش </button> </div> </div> </form> </section> <section class="panel"> <h2>👥 مشتریان</h2> <div id="customerList"></div> </section> </main> <script> (() => { "use strict"; const PRODUCTS = [ { key: "apple", name: "سیب", emoji: "🍎", price: 1000000 }, { key: "raisins", name: "کشمش", emoji: "🍇", price: 800000 }, { key: "cans", name: "قوطی", emoji: "🥫", price: 1000000 } ]; const CUSTOMER_KEY = "hesab_customers_v1"; const SETTINGS_KEY = "hesab_settings_v1"; function loadJSON(key, fallback) { try { const raw = localStorage.getItem(key); if (raw === null) return fallback; return JSON.parse(raw); } catch { return fallback; } } let customers = loadJSON(CUSTOMER_KEY, []); let settings = loadJSON(SETTINGS_KEY, { cardNumber: "", cardHolder: "" }); let editingId = null; let formQuantities = { apple: 0, raisins: 0, cans: 0 }; const form = document.getElementById("customerForm"); const formProducts = document.getElementById("formProducts"); const customerList = document.getElementById("customerList"); const debtCustomerList = document.getElementById("debtCustomerList"); const grandTotal = document.getElementById("grandTotal"); const nameInput = document.getElementById("customerName"); const mobileInput = document.getElementById("customerMobile"); const formTotal = document.getElementById("formTotal"); const formTitle = document.getElementById("formTitle"); const saveButton = document.getElementById("saveButton"); const cancelEdit = document.getElementById("cancelEdit"); const cardNumberInput = document.getElementById("cardNumber"); const cardHolderInput = document.getElementById("cardHolder"); function formatNumber(number) { return new Intl.NumberFormat("fa-IR").format(number); } function normalizeDigits(value) { return String(value) .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)) ) .replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)) ); } function formatCard(value) { const digits = normalizeDigits(value) .replace(/\D/g, "") .slice(0, 16); return digits.match(/.{1,4}/g)?.join("-") || ""; } function totalFor(quantities) { return PRODUCTS.reduce((sum, product) => { return sum + (Number(quantities?.[product.key]) || 0) * product.price; }, 0); } function totalAllCustomers() { return customers.reduce((sum, customer) => { return sum + totalFor(customer.quantities); }, 0); } function saveCustomers() { try { localStorage.setItem(CUSTOMER_KEY, JSON.stringify(customers)); } catch (e) { console.error("Cannot save customers to localStorage", e); alert("ذخیره اطلاعات مشتریان انجام نشد."); } } function renderDebtSummary() { debtCustomerList.innerHTML = ""; if (customers.length === 0) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "هنوز طلبی ثبت نشده است."; debtCustomerList.appendChild(empty); } else { customers.forEach(customer => { const row = document.createElement("div"); row.className = "debt-customer-row"; const name = document.createElement("span"); name.className = "debt-customer-name"; name.textContent = customer.name; const amount = document.createElement("span"); amount.className = "debt-customer-amount"; amount.textContent = `${formatNumber(totalFor(customer.quantities))} تومان`; row.append(name, amount); debtCustomerList.appendChild(row); }); } grandTotal.textContent = formatNumber(totalAllCustomers()); } function makeProductControls(container, quantities, onChange, prefix) { container.innerHTML = ""; PRODUCTS.forEach(product => { const wrapper = document.createElement("div"); wrapper.className = "product"; const title = document.createElement("div"); title.className = "product-title"; const productName = document.createElement("span"); productName.textContent = `${product.emoji} ${product.name}`; const price = document.createElement("span"); price.className = "price"; price.textContent = `${formatNumber(product.price)} تومان`; title.append(productName, price); const controls = document.createElement("div"); controls.className = "quantity-control"; const minus = document.createElement("button"); minus.type = "button"; minus.className = "qty-btn secondary"; minus.textContent = "−"; minus.setAttribute("aria-label", `کاهش تعداد ${product.name}`); const input = document.createElement("input"); input.type = "number"; input.min = "0"; input.step = "1"; input.inputMode = "numeric"; input.value = Number(quantities[product.key]) || 0; input.id = `${prefix}-${product.key}`; input.setAttribute("aria-label", `تعداد ${product.name}`); const plus = document.createElement("button"); plus.type = "button"; plus.className = "qty-btn"; plus.textContent = "+"; plus.setAttribute("aria-label", `افزایش تعداد ${product.name}`); const update = value => { const count = Math.max(0, Math.floor(Number(value) || 0)); quantities[product.key] = count; input.value = count; onChange(); }; minus.addEventListener("click", () => { update(Number(input.value) - 1); }); plus.addEventListener("click", () => { update(Number(input.value) + 1); }); input.addEventListener("input", () => { update(input.value); }); controls.append(minus, input, plus); wrapper.append(title, controls); container.appendChild(wrapper); }); } function updateFormTotal() { formTotal.textContent = formatNumber(totalFor(formQuantities)); } function renderFormProducts() { makeProductControls( formProducts, formQuantities, updateFormTotal, "form" ); updateFormTotal(); } function renderCustomers() { customerList.innerHTML = ""; if (customers.length === 0) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "هنوز مشتری‌ای ثبت نشده است."; customerList.appendChild(empty); renderDebtSummary(); return; } customers.forEach(customer => { const card = document.createElement("article"); card.className = "customer-card"; const head = document.createElement("div"); head.className = "customer-head"; const identity = document.createElement("div"); const customerName = document.createElement("div"); customerName.className = "customer-name"; customerName.textContent = customer.name; identity.appendChild(customerName); if (customer.mobile) { const mobile = document.createElement("div"); mobile.className = "mobile"; mobile.textContent = customer.mobile; identity.appendChild(mobile); } const topActions = document.createElement("div"); topActions.className = "actions"; const editButton = document.createElement("button"); editButton.type = "button"; editButton.className = "secondary"; editButton.textContent = "ویرایش"; editButton.addEventListener("click", () => startEdit(customer.id)); const deleteButton = document.createElement("button"); deleteButton.type = "button"; deleteButton.className = "danger"; deleteButton.textContent = "حذف"; deleteButton.addEventListener("click", () => deleteCustomer(customer.id)); topActions.append(editButton, deleteButton); head.append(identity, topActions); const items = document.createElement("div"); items.className = "customer-items"; PRODUCTS.forEach(product => { const item = document.createElement("div"); item.className = "customer-item"; const label = document.createElement("span"); label.textContent = `${product.emoji} ${product.name}`; const controls = document.createElement("div"); controls.className = "quantity-control"; const minus = document.createElement("button"); minus.type = "button"; minus.className = "qty-btn secondary"; minus.textContent = "−"; minus.setAttribute( "aria-label", `کاهش ${product.name} برای ${customer.name}` ); const count = document.createElement("span"); count.className = "count"; count.textContent = formatNumber( Number(customer.quantities?.[product.key]) || 0 ); const plus = document.createElement("button"); plus.type = "button"; plus.className = "qty-btn"; plus.textContent = "+"; plus.setAttribute( "aria-label", `افزایش ${product.name} برای ${customer.name}` ); const adjust = delta => { customer.quantities ??= {}; customer.quantities[product.key] = Math.max( 0, (Number(customer.quantities[product.key]) || 0) + delta ); saveCustomers(); renderCustomers(); }; minus.addEventListener("click", () => adjust(-1)); plus.addEventListener("click", () => adjust(1)); controls.append(minus, count, plus); item.append(label, controls); items.appendChild(item); }); const bottom = document.createElement("div"); bottom.className = "customer-bottom"; const total = document.createElement("div"); total.className = "customer-total"; total.setAttribute("aria-live", "polite"); total.textContent = `جمع بدهی: ${formatNumber(totalFor(customer.quantities))} تومان`; const messageButton = document.createElement("button"); messageButton.type = "button"; messageButton.textContent = "📋 تولید و کپی پیام"; messageButton.addEventListener("click", () => { generateAndCopy(customer); }); bottom.append(total, messageButton); card.append(head, items, bottom); customerList.appendChild(card); }); renderDebtSummary(); } function startEdit(id) { const customer = customers.find(item => item.id === id); if (!customer) return; editingId = id; nameInput.value = customer.name; mobileInput.value = customer.mobile || ""; formQuantities = { apple: Number(customer.quantities?.apple) || 0, raisins: Number(customer.quantities?.raisins) || 0, cans: Number(customer.quantities?.cans) || 0 }; renderFormProducts(); formTitle.textContent = "ویرایش مشتری"; saveButton.textContent = "ذخیره تغییرات"; cancelEdit.hidden = false; form.scrollIntoView({ behavior: "smooth", block: "start" }); nameInput.focus(); } function resetForm() { form.reset(); editingId = null; formQuantities = { apple: 0, raisins: 0, cans: 0 }; formTitle.textContent = "افزودن مشتری"; saveButton.textContent = "ذخیره مشتری"; cancelEdit.hidden = true; renderFormProducts(); } function deleteCustomer(id) { if (!confirm("آیا از حذف این مشتری مطمئن هستید؟")) return; customers = customers.filter(customer => customer.id !== id); saveCustomers(); renderCustomers(); if (editingId === id) { resetForm(); } } function buildMessage(customer) { const lines = [`${customer.name} عزیز`, ""]; PRODUCTS.forEach(product => { const quantity = Number(customer.quantities?.[product.key]) || 0; if (quantity > 0) { const lineTotal = quantity * product.price; lines.push( `${product.name} ${formatNumber(quantity)} عدد ${formatNumber(lineTotal)} تومان` ); } }); lines.push(""); lines.push( `جمع کل ${formatNumber(totalFor(customer.quantities))} تومان` ); if (settings.cardNumber || settings.cardHolder) { lines.push(""); lines.push("اطلاعات واریز:"); if (settings.cardNumber) { lines.push(`شماره کارت: \u2066${settings.cardNumber}\u2069`); } if (settings.cardHolder) { lines.push(`به نام: ${settings.cardHolder}`); } } return lines.join("\n"); } async function generateAndCopy(customer) { const message = buildMessage(customer); try { await navigator.clipboard.writeText(message); alert("پیام کپی شد."); } catch { const textarea = document.createElement("textarea"); textarea.value = message; textarea.style.position = "fixed"; textarea.style.opacity = "0"; document.body.appendChild(textarea); textarea.select(); try { const copied = document.execCommand("copy"); if (copied) { alert("پیام کپی شد."); } else { window.prompt("پیام را کپی کنید:", message); } } catch { window.prompt("پیام را کپی کنید:", message); } finally { textarea.remove(); } } } form.addEventListener("submit", event => { event.preventDefault(); const name = nameInput.value.trim(); if (!name) { nameInput.focus(); return; } const normalizedMobile = normalizeDigits(mobileInput.value.trim()) .replace(/\D/g, ""); const record = { id: editingId || ( crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}` ), name, mobile: normalizedMobile || mobileInput.value.trim(), quantities: { ...formQuantities } }; if (editingId) { customers = customers.map(customer => customer.id === editingId ? record : customer ); } else { customers.unshift(record); } saveCustomers(); renderCustomers(); resetForm(); }); cancelEdit.addEventListener("click", resetForm); cardNumberInput.addEventListener("input", () => { const position = cardNumberInput.selectionStart || 0; const before = cardNumberInput.value.slice(0, position); const digitsBefore = normalizeDigits(before).replace(/\D/g, "").length; cardNumberInput.value = formatCard(cardNumberInput.value); let newPosition = 0; let seenDigits = 0; while ( newPosition < cardNumberInput.value.length && seenDigits < digitsBefore ) { if (/\d/.test(cardNumberInput.value[newPosition])) { seenDigits++; } newPosition++; } if ( digitsBefore > 0 && digitsBefore % 4 === 0 && newPosition < cardNumberInput.value.length ) { newPosition++; } cardNumberInput.setSelectionRange(newPosition, newPosition); }); document.getElementById("saveSettings").addEventListener("click", () => { settings = { cardNumber: formatCard(cardNumberInput.value), cardHolder: cardHolderInput.value.trim() }; cardNumberInput.value = settings.cardNumber; try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); alert("تنظیمات کارت ذخیره شد."); } catch (e) { console.error("Cannot save settings", e); alert("ذخیره‌سازی انجام نشد. لطفاً تنظیمات مرورگر را بررسی کنید."); } }); cardNumberInput.value = formatCard(settings.cardNumber || ""); cardHolderInput.value = settings.cardHolder || ""; renderFormProducts(); renderCustomers(); })(); </script> </body> </html>
